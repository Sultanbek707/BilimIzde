<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>BilimIzde · Статистика</title>
<style>
body{font-family:system-ui,sans-serif;background:#111418;color:#ece9e2;max-width:1000px;margin:0 auto;padding:28px 18px}
h1{font-size:24px;margin:0 0 6px}p{color:#9aa0a6}
.k{display:flex;gap:10px;margin:16px 0}input,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #2c3036;background:#1a1d22;color:inherit}button{cursor:pointer;background:#ece9e2;color:#111;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}
.card{background:#1a1d22;border:1px solid #2c3036;border-radius:14px;padding:14px 16px}.card b{font-size:26px;display:block}.card span{color:#9aa0a6;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 8px;border-bottom:1px solid #2c3036;text-align:left}th{color:#9aa0a6;font-weight:600}td:last-child{text-align:right}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin:10px 0 4px}.bars div{flex:1;background:#e8a13a;border-radius:3px 3px 0 0;min-height:2px}
.err{color:#f87171}
</style>
</head>
<body>
<h1>BilimIzde · Статистика</h1>
<p>Кілт — серверде орнатылған BZ_ADMIN_KEY. IP мен жеке дерек жиналмайды.</p>
<div class="k"><input id="key" type="password" placeholder="Әкімші кілті"><select id="days"><option value="7">7 күн</option><option value="30" selected>30 күн</option><option value="90">90 күн</option></select><button id="go">Көрсету</button></div>
<div id="out"></div>
<script>
const $=id=>document.getElementById(id),e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('key').value=sessionStorage.getItem('bzk')||'';
const tbl=(t,rows)=>`<div><h3>${t}</h3><table>${rows.length?rows.map(r=>`<tr><td>${e(r.value||r.lang||'')}</td><td>${r.n}</td></tr>`).join(''):'<tr><td>Дерек жоқ</td><td></td></tr>'}</table></div>`;
$('go').onclick=async()=>{const k=$('key').value.trim();sessionStorage.setItem('bzk',k);
 const r=await fetch(`/api/admin/stats?days=${$('days').value}&key=${encodeURIComponent(k)}`);
 if(!r.ok){$('out').innerHTML=`<p class="err">${r.status===403?'Кілт қате немесе BZ_ADMIN_KEY орнатылмаған':'Қате: '+r.status}</p>`;return}
 const d=await r.json(),views=d.per_day.reduce((a,x)=>a+x.n,0),mx=Math.max(1,...d.per_day.map(x=>x.n));
 $('out').innerHTML=`<div class="cards"><div class="card"><b>${views}</b><span>бет қаралды (${d.days} күн)</span></div><div class="card"><b>${d.searches.reduce((a,x)=>a+x.n,0)}</b><span>іздеу</span></div><div class="card"><b>${d.ai_questions.reduce((a,x)=>a+x.n,0)}</b><span>AI сұрағы</span></div><div class="card"><b>${d.users}</b><span>тіркелген қолданушы</span></div><div class="card"><b>${d.club_posts}</b><span>клуб пікірі</span></div></div>
 <h3>Күн сайынғы қаралым</h3><div class="bars">${d.per_day.map(x=>`<div title="${x.day}: ${x.n}" style="height:${x.n/mx*100}%"></div>`).join('')}</div>
 <div class="grid">${tbl('Ең көп ашылған беттер',d.pages)}${tbl('Не іздейді',d.searches)}${tbl('AI-ға сұрақтар',d.ai_questions)}${tbl('Тілдер',d.langs)}</div>`};
</script>
</body>
</html>
