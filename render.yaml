services:
  - type: web
    name: bilimizde
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Барлығы міндетті емес. Орнатылмаса, сол мүмкіндік жай өшік тұрады.
      - key: BZ_SITE_URL            # сайт адресі, мысалы https://bilimizde.onrender.com (SEO, бот сілтемелері)
        sync: false
      - key: BZ_ADMIN_KEY           # /admin.html статистикасына кіру кілті
        sync: false
      - key: DATABASE_URL           # PostgreSQL (пікірлер мен қолданушылар өшпеуі үшін)
        sync: false
      - key: FIREBASE_PROJECT_ID    # Google / телефон арқылы тіркелу
        sync: false
      - key: FIREBASE_WEB_CONFIG
        sync: false
      - key: AUTH_REQUIRED          # 1 (әдепкі) — сайтқа кірмей қолдануға болмайды; 0 — кіру міндетті емес
        value: "1"
      - key: AUTH_PHONE             # 1 — телефонмен кіру көрсетіледі (SMS үшін Firebase Blaze жоспары керек)
        value: "0"
      - key: TELEGRAM_BOT_TOKEN     # Telegram-бот
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY      # AI кеңесшіге тіл моделі
        sync: false
